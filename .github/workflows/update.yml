name: Refresh data

# Re-fetch the script-accessible sources and rebuild grants.csv + site/data.js,
# commit any change, then redeploy the site. Coefficient Giving is collected by
# hand in a browser (see README), so this job never touches it.
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write           # needed to start the Pages deploy below

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch + rebuild
        run: |
          python3 scrapers/fetch_ea_funds.py || true
          python3 scrapers/fetch_html.py || true
          python3 scrapers/fetch_manifund.py data/raw/manifund || true
          python3 scrapers/build_grants.py
          python3 scrapers/build_site.py
      - name: Commit changes
        id: commit
        run: |
          git config user.name "funding-flows-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/data.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: weekly refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with GITHUB_TOKEN does not trigger other workflows, so start the deploy explicitly.
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
